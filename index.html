<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dima Landa — Dynamics 365 &amp; Microsoft 365 Audits</title>
<meta name="description" id="metaDesc" content="Independent audits of Dynamics 365 CRM, Microsoft 365 and Entra ID. Security gaps, wasted licenses, broken data. 20+ years in IT, remote worldwide.">
<link rel="alternate" hreflang="en" href="https://dimalanda.com/">
<link rel="alternate" hreflang="de" href="https://dimalanda.com/#de">
<link rel="alternate" hreflang="ko" href="https://dimalanda.com/#ko">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12212B;
  --ink-soft:#44585F;
  --paper:#F1F3F0;
  --panel:#FFFFFF;
  --rule:#C4CEC9;
  --accent:#17564F;
  --high:#A93A26;
  --med:#9A6E0B;
  --low:#4F6E7E;
  --max:1120px;
  --display:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
html.lang-ko{
  --display:"Noto Sans KR","Bricolage Grotesque",system-ui,sans-serif;
  --body:"Noto Sans KR","Public Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;hyphens:manual;scroll-behavior:smooth}
html.lang-de{hyphens:auto}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:17px;line-height:1.62;
  -webkit-font-smoothing:antialiased;overflow-x:clip;
}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.022em;line-height:1.06;margin:0}
html.lang-ko h1,html.lang-ko h2,html.lang-ko h3{font-weight:700;letter-spacing:-.01em;line-height:1.3}
html.lang-ko body{line-height:1.72}
p{margin:0}
a{color:inherit}
.wrap{max-width:var(--max);margin:0 auto;padding:0 20px;width:100%}
@media(min-width:760px){.wrap{padding:0 28px}}
.mono{font-family:var(--mono);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;line-height:1.5}
@media(min-width:760px){.mono{font-size:.73rem;letter-spacing:.14em}}
html.lang-ko .mono{text-transform:none;letter-spacing:.02em;font-family:var(--body);font-weight:500;font-size:.85rem}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:rgba(241,243,240,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.topbar .wrap{display:flex;align-items:center;gap:14px;min-height:58px}
.brand{font-family:var(--display);font-weight:600;letter-spacing:-.02em;font-size:1.05rem;white-space:nowrap;margin-right:auto}
.tagline{color:var(--ink-soft);display:none;margin-right:auto}
@media(min-width:1040px){.tagline{display:block}.brand{margin-right:0}}
.langs{display:flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden;flex:none}
.lang{
  font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;font-weight:500;
  background:transparent;border:0;border-left:1px solid var(--rule);
  color:var(--ink-soft);padding:8px 11px;cursor:pointer;min-height:38px;
}
.lang:first-child{border-left:0}
.lang[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.topbar .btn{display:none}
@media(min-width:640px){.topbar .btn{display:inline-block}}
.btn{
  display:inline-block;border:1px solid var(--ink);background:var(--ink);color:var(--paper);
  padding:13px 20px;border-radius:2px;text-decoration:none;font-weight:600;font-size:1rem;
  line-height:1.2;transition:background .15s ease;
}
.btn:hover{background:var(--accent);border-color:var(--accent)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn-ghost:hover{background:transparent;color:var(--accent);border-color:var(--accent)}
.btn-sm{padding:9px 15px;font-size:.9rem}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* ---------- hero ---------- */
.hero{padding:44px 0 52px;background-image:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(18,33,43,.04) 31px 32px)}
@media(min-width:760px){.hero{padding:64px 0 72px}}
.hero .wrap{display:grid;gap:40px}
@media(min-width:960px){.hero .wrap{grid-template-columns:1.02fr .98fr;gap:56px;align-items:start}}
.eyebrow{color:var(--accent);margin-bottom:16px}
h1{font-size:clamp(2.05rem,7.6vw,4rem)}
@media(min-width:760px){h1{font-size:clamp(2.6rem,5.6vw,4rem)}}
html.lang-ko h1{font-size:clamp(1.85rem,6.6vw,3.3rem)}
h1 em{font-style:normal;color:var(--accent);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.lede{margin-top:20px;font-size:1.08rem}
@media(min-width:960px){.lede{max-width:35ch;font-size:1.12rem}}
.cta-row{margin-top:26px;display:flex;flex-wrap:wrap;gap:10px}
.cta-row .btn{flex:1 1 auto;text-align:center}
@media(min-width:520px){.cta-row .btn{flex:0 0 auto}}
.note{margin-top:20px;color:var(--ink-soft)}

/* ---------- findings panel ---------- */
.report{position:relative;background:var(--panel);border:1px solid var(--ink);border-radius:3px;box-shadow:5px 5px 0 rgba(18,33,43,.09);overflow:hidden}
.scan{
  position:absolute;left:0;right:0;top:0;height:64px;pointer-events:none;z-index:2;
  background:linear-gradient(to bottom,rgba(23,86,79,0) 0%,rgba(23,86,79,.09) 60%,rgba(23,86,79,.5) 100%);
  border-bottom:1px solid rgba(23,86,79,.55);
  animation:scan 9s cubic-bezier(.5,0,.5,1) 1.4s infinite;opacity:0;
}
@keyframes scan{
  0%{transform:translateY(-70px);opacity:0}
  6%{opacity:1}
  38%{transform:translateY(560px);opacity:1}
  46%{transform:translateY(560px);opacity:0}
  100%{transform:translateY(560px);opacity:0}
}
@media(min-width:760px){.report{box-shadow:10px 10px 0 rgba(18,33,43,.08)}}
.report-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:13px 16px;border-bottom:1px solid var(--rule);background:#F7F8F6}
.report-head .mono{color:var(--ink-soft)}
.report-head strong{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;color:var(--accent);font-weight:600;white-space:nowrap}
html.lang-ko .report-head strong{font-family:var(--body);letter-spacing:0;font-size:.8rem}
.rows{list-style:none;margin:0;padding:0}
.row{display:block;padding:15px 16px;border-bottom:1px solid var(--rule);transition:background .15s ease}
@media(min-width:520px){.row{display:grid;grid-template-columns:80px 1fr;gap:14px;padding:16px 18px}}
.row:hover{background:#F7F9F7}
.sev{
  display:inline-block;font-family:var(--mono);font-size:.68rem;letter-spacing:.09em;font-weight:600;
  padding:2px 0 2px 8px;border-left:3px solid currentColor;margin-bottom:7px;align-self:start;
}
@media(min-width:520px){.sev{margin-bottom:0}}
html.lang-ko .sev{font-family:var(--body);letter-spacing:0;font-size:.8rem}
.sev.high{color:var(--high)}
.sev.med{color:var(--med)}
.sev.low{color:var(--low)}
.row h3{font-family:var(--body);font-weight:600;font-size:1.02rem;letter-spacing:0;line-height:1.4}
.row p{color:var(--ink-soft);font-size:.94rem;margin-top:4px}
.report-foot{padding:13px 16px;background:#F7F8F6}
.report-foot .mono{color:var(--ink-soft)}

/* ---------- sections ---------- */
section{border-top:1px solid var(--rule)}
.hero{border-top:0}
.block{padding:52px 0}
@media(min-width:760px){.block{padding:70px 0}}
.sec-label{color:var(--accent);margin-bottom:14px}
h2{font-size:clamp(1.6rem,5.2vw,2.4rem);max-width:24ch}
@media(min-width:760px){h2{font-size:clamp(1.8rem,3.6vw,2.4rem)}}
.sub{margin-top:16px;color:var(--ink-soft);max-width:58ch;font-size:1.03rem}
.sub + .sub{margin-top:14px}

.grid{display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:34px}
@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--paper);padding:26px 22px}
@media(min-width:760px){.card{padding:30px 28px}}
.card h3{font-size:1.2rem;margin-bottom:10px}
.card p{color:var(--ink-soft);font-size:.98rem}
.card ul{margin:16px 0 0;padding:0;list-style:none}
.card li{font-family:var(--mono);font-size:.83rem;line-height:1.55;color:var(--ink-soft);padding:5px 0 5px 16px;position:relative}
html.lang-ko .card li{font-family:var(--body);font-size:.93rem}
.card li::before{content:"—";position:absolute;left:0;color:var(--accent)}

.steps{display:grid;gap:26px;margin-top:34px}
@media(min-width:780px){.steps{grid-template-columns:repeat(3,1fr);gap:32px}}
.step{padding-top:16px;border-top:2px solid var(--ink)}
.step .num{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;color:var(--accent);display:block;margin-bottom:10px}
html.lang-ko .step .num{font-family:var(--body);letter-spacing:0;font-size:.85rem;font-weight:500}
.step h3{font-size:1.14rem;margin-bottom:8px}
.step p{color:var(--ink-soft);font-size:.97rem}

.about{display:grid;gap:32px}
@media(min-width:880px){.about{grid-template-columns:1.15fr .85fr;gap:56px;align-items:start}}
.facts{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.facts li{display:flex;flex-direction:column;gap:2px;padding:12px 0;border-bottom:1px solid var(--rule);font-size:1rem}
@media(min-width:520px){.facts li{flex-direction:row;justify-content:space-between;gap:16px}.facts .v{text-align:right}}
.facts .k{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);padding-top:3px;white-space:nowrap}
html.lang-ko .facts .k{font-family:var(--body);text-transform:none;letter-spacing:0;font-size:.87rem}
.facts .v{font-weight:500}

.contact{background:var(--ink);color:var(--paper)}
.contact h2{color:var(--paper)}
.contact .sec-label{color:#82BDB3}
.contact .sub{color:#B2C2C8}
.mail{
  display:inline-block;margin-top:26px;font-family:var(--display);font-weight:800;
  letter-spacing:-.02em;font-size:clamp(1.25rem,5.6vw,2.2rem);color:var(--paper);
  text-decoration:none;border-bottom:2px solid #82BDB3;padding-bottom:4px;
  overflow-wrap:break-word;max-width:100%;
}
.mail:hover{color:#82BDB3}

footer{border-top:1px solid var(--rule);padding:24px 0}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
footer .mono{color:var(--ink-soft)}

/* ---------- stats strip ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.stat{background:var(--paper);padding:26px 14px;text-align:center}
@media(min-width:760px){.stat{padding:34px 20px}}
.stat .n{
  display:block;font-family:var(--display);font-weight:800;letter-spacing:-.03em;
  font-size:clamp(2.1rem,9vw,3.4rem);line-height:1;color:var(--accent);
  font-variant-numeric:tabular-nums;
}
.stat .l{display:block;margin-top:9px;color:var(--ink-soft);font-size:.82rem;line-height:1.35}
@media(min-width:760px){.stat .l{font-size:.92rem}}

/* ---------- scroll reveal + hover motion ---------- */
.card,.step,.facts li,.stat{transition:transform .45s cubic-bezier(.2,.7,.3,1),opacity .45s ease,background .2s ease}
.io{opacity:0;transform:translateY(14px)}
.io.in{opacity:1;transform:none}
.card{position:relative}
.card::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);transform:scaleY(0);transform-origin:top;transition:transform .3s cubic-bezier(.2,.7,.3,1)}
.card:hover::after,.card:focus-within::after{transform:scaleY(1)}
.card:hover{background:#F6F8F5}
.step{transition:border-color .2s ease}
.step:hover{border-top-color:var(--accent)}
.btn{will-change:transform}
.btn:active{transform:translateY(1px)}
.sev{transition:transform .2s ease}
.row:hover .sev{transform:translateX(2px)}
footer .joke{color:var(--ink-soft);flex-basis:100%;order:3;padding-top:6px}

.row,.reveal{opacity:0;transform:translateY(8px);animation:rise .5s cubic-bezier(.2,.7,.3,1) forwards}
.reveal{animation-delay:.05s}
.rows .row:nth-child(1){animation-delay:.28s}
.rows .row:nth-child(2){animation-delay:.4s}
.rows .row:nth-child(3){animation-delay:.52s}
.rows .row:nth-child(4){animation-delay:.64s}
.rows .row:nth-child(5){animation-delay:.76s}
@keyframes rise{to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .row,.reveal{animation:none;opacity:1;transform:none}
  .scan{display:none}
  .io{opacity:1;transform:none}
  .card,.step,.facts li,.stat,.sev,.btn{transition:none}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <span class="brand">Dima Landa</span>
    <span class="mono tagline" data-i18n="nav.tag"></span>
    <div class="langs" role="group" aria-label="Language">
      <button class="lang" data-lang="en" aria-pressed="true">EN</button>
      <button class="lang" data-lang="de" aria-pressed="false">DE</button>
      <button class="lang" data-lang="ko" aria-pressed="false">KO</button>
    </div>
    <a class="btn btn-sm mailto" href="mailto:dima@dimalanda.com" data-i18n="nav.cta"></a>
  </div>
</header>

<main>
<section class="hero">
  <div class="wrap">
    <div class="reveal">
      <p class="mono eyebrow" data-i18n="hero.eyebrow"></p>
      <h1 data-i18n="hero.h1"></h1>
      <p class="lede" data-i18n="hero.lede"></p>
      <div class="cta-row">
        <a class="btn mailto" href="mailto:dima@dimalanda.com" data-i18n="hero.cta1"></a>
        <a class="btn btn-ghost" href="#scope" data-i18n="hero.cta2"></a>
      </div>
      <p class="mono note" data-i18n="hero.note"></p>
    </div>

    <div class="report reveal">
      <div class="scan" aria-hidden="true"></div>
      <div class="report-head">
        <span class="mono" data-i18n="rep.head"></span>
        <strong data-i18n="rep.tag"></strong>
      </div>
      <ul class="rows">
        <li class="row"><span class="sev high" data-i18n="sev.high"></span><div><h3 data-i18n="rep.f1t"></h3><p data-i18n="rep.f1d"></p></div></li>
        <li class="row"><span class="sev high" data-i18n="sev.high"></span><div><h3 data-i18n="rep.f2t"></h3><p data-i18n="rep.f2d"></p></div></li>
        <li class="row"><span class="sev med" data-i18n="sev.med"></span><div><h3 data-i18n="rep.f3t"></h3><p data-i18n="rep.f3d"></p></div></li>
        <li class="row"><span class="sev med" data-i18n="sev.med"></span><div><h3 data-i18n="rep.f4t"></h3><p data-i18n="rep.f4d"></p></div></li>
        <li class="row"><span class="sev low" data-i18n="sev.low"></span><div><h3 data-i18n="rep.f5t"></h3><p data-i18n="rep.f5d"></p></div></li>
      </ul>
      <div class="report-foot"><span class="mono" data-i18n="rep.foot"></span></div>
    </div>
  </div>
</section>

<section class="stats">
  <div class="stat io"><span class="n" data-count="20" data-suffix="+">0</span><span class="l" data-i18n="st1"></span></div>
  <div class="stat io"><span class="n" data-count="4">0</span><span class="l" data-i18n="st2"></span></div>
  <div class="stat io"><span class="n" data-count="60">0</span><span class="l" data-i18n="st3"></span></div>
</section>

<section id="scope">
  <div class="wrap block">
    <p class="mono sec-label" data-i18n="scope.label"></p>
    <h2 data-i18n="scope.h2"></h2>
    <p class="sub" data-i18n="scope.sub"></p>
    <div class="grid">
      <div class="card io"><h3 data-i18n="c1.h"></h3><p data-i18n="c1.p"></p><ul><li data-i18n="c1.a"></li><li data-i18n="c1.b"></li><li data-i18n="c1.c"></li><li data-i18n="c1.d"></li></ul></div>
      <div class="card io"><h3 data-i18n="c2.h"></h3><p data-i18n="c2.p"></p><ul><li data-i18n="c2.a"></li><li data-i18n="c2.b"></li><li data-i18n="c2.c"></li><li data-i18n="c2.d"></li></ul></div>
      <div class="card io"><h3 data-i18n="c3.h"></h3><p data-i18n="c3.p"></p><ul><li data-i18n="c3.a"></li><li data-i18n="c3.b"></li><li data-i18n="c3.c"></li><li data-i18n="c3.d"></li></ul></div>
      <div class="card io"><h3 data-i18n="c4.h"></h3><p data-i18n="c4.p"></p><ul><li data-i18n="c4.a"></li><li data-i18n="c4.b"></li><li data-i18n="c4.c"></li><li data-i18n="c4.d"></li></ul></div>
    </div>
  </div>
</section>

<section>
  <div class="wrap block">
    <p class="mono sec-label" data-i18n="proc.label"></p>
    <h2 data-i18n="proc.h2"></h2>
    <div class="steps">
      <div class="step io"><span class="num" data-i18n="s1.n"></span><h3 data-i18n="s1.h"></h3><p data-i18n="s1.p"></p></div>
      <div class="step io"><span class="num" data-i18n="s2.n"></span><h3 data-i18n="s2.h"></h3><p data-i18n="s2.p"></p></div>
      <div class="step io"><span class="num" data-i18n="s3.n"></span><h3 data-i18n="s3.h"></h3><p data-i18n="s3.p"></p></div>
    </div>
  </div>
</section>

<section>
  <div class="wrap block">
    <div class="about">
      <div>
        <p class="mono sec-label" data-i18n="ab.label"></p>
        <h2 data-i18n="ab.h2"></h2>
        <p class="sub" data-i18n="ab.p1"></p>
        <p class="sub" data-i18n="ab.p2"></p>
      </div>
      <ul class="facts">
        <li class="io"><span class="k" data-i18n="f1k"></span><span class="v" data-i18n="f1v"></span></li>
        <li class="io"><span class="k" data-i18n="f2k"></span><span class="v" data-i18n="f2v"></span></li>
        <li class="io"><span class="k" data-i18n="f3k"></span><span class="v" data-i18n="f3v"></span></li>
        <li class="io"><span class="k" data-i18n="f4k"></span><span class="v" data-i18n="f4v"></span></li>
        <li class="io"><span class="k" data-i18n="f5k"></span><span class="v" data-i18n="f5v"></span></li>
      </ul>
    </div>
  </div>
</section>

<section class="contact">
  <div class="wrap block">
    <p class="mono sec-label" data-i18n="ct.label"></p>
    <h2 data-i18n="ct.h2"></h2>
    <p class="sub" data-i18n="ct.sub"></p>
    <a class="mail mailto" href="mailto:dima@dimalanda.com">dima@dimalanda.com</a>
  </div>
</section>
</main>

<footer>
  <div class="wrap">
    <span class="mono">© 2026 Dima Landa</span>
    <span class="mono">dimalanda.com</span>
    <span class="mono joke" data-i18n="joke"></span>
  </div>
</footer>

<script>
const I18N = {

 "meta.title":"Dima Landa — Dynamics 365 & Microsoft 365 Audits",

 "hero.note":"20+ years in IT · remote, worldwide · independent consultant",
 "rep.head":"Sample findings","rep.tag":"TENANT REVIEW",

let koFontLoaded = false;
function setLang(lang){
  if(!I18N[lang]) lang = "en";
  const t = I18N[lang];
  const html = document.documentElement;
  html.lang = lang;
  html.className = "lang-" + lang;
  document.title = t["meta.title"];
  document.getElementById("metaDesc").setAttribute("content", t["meta.desc"]);
  document.querySelectorAll("[data-i18n]").forEach(function(el){
    const v = t[el.getAttribute("data-i18n")];
    if(v !== undefined) el.innerHTML = v;
  });
  document.querySelectorAll(".mailto").forEach(function(a){
    a.href = "mailto:dima@dimalanda.com?subject=" + encodeURIComponent(t["mail.subject"]);
  });
  document.querySelectorAll(".lang").forEach(function(b){
    b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false");
  });
  if(lang === "ko" && !koFontLoaded){
    const l = document.createElement("link");
    l.rel = "stylesheet";
    l.href = "https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap";
    document.head.appendChild(l);
    koFontLoaded = true;
  }
}
document.querySelectorAll(".lang").forEach(function(b){
  b.addEventListener("click", function(){
    const l = b.dataset.lang;
    history.replaceState(null, "", l === "en" ? location.pathname : "#" + l);
    setLang(l);
  });
});

/* scroll reveal + counters */
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function countUp(el){
  const target = parseInt(el.dataset.count,10);
  const suffix = el.dataset.suffix || "";
  if(reduce){ el.textContent = target + suffix; return; }
  const dur = 1100, t0 = performance.now();
  function tick(now){
    const p = Math.min((now - t0)/dur, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(target * eased) + (p === 1 ? suffix : "");
    if(p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
if("IntersectionObserver" in window){
  const io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(!e.isIntersecting) return;
      const el = e.target;
      const sibs = Array.prototype.slice.call(el.parentNode.children).filter(function(n){return n.classList.contains("io")});
      el.style.transitionDelay = (Math.min(sibs.indexOf(el),5) * 90) + "ms";
      el.classList.add("in");
      const n = el.querySelector("[data-count]");
      if(n && !n.dataset.done){ n.dataset.done = "1"; countUp(n); }
      io.unobserve(el);
    });
  }, {threshold:.18, rootMargin:"0px 0px -40px 0px"});
  document.querySelectorAll(".io").forEach(function(el){ io.observe(el); });
} else {
  document.querySelectorAll(".io").forEach(function(el){ el.classList.add("in"); });
  document.querySelectorAll("[data-count]").forEach(countUp);
}

const h = (location.hash || "").replace("#","").toLowerCase();
setLang(["de","ko"].indexOf(h) > -1 ? h : "en");
</script>
